<!DOCTYPE html>

<html lang="en">

<head>

 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
  integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
 <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
 <title>
  blogWeb: {% block title %} {%endblock%}
 </title>
</head>

<body>
 <!-- open sidebar button -->
 <button id="open-sidebar-button" onclick="openSidebar()" aria-label="open sidebar" aria-expanded="false" aria-controls="navbar">
  <svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32" fill="currentColor">
   <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
  </svg>
 </button>

 <nav id="navbar">
  <ul>
   <!-- close sidebar button -->
   <li><button id="close-sidebar-button" onclick="closeSidebar();" aria-label="close sidebar">
    <svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32" fill="currentColor">
    <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
   </svg></button></li>

   {% set active_page = request.endpoint %}

   {% if session["userID"] %}
    <li class="home-li"><a href="{{ url_for('home') }}" class="{{ 'active-link' if active_page == 'home' }}" aria-current="page">HOME</a></li>
    <li><a href="{{ url_for('blog') }}" class="{{ 'active-link' if active_page == 'blog' }}">BLOG</a></li>
    <li><a href="{{ url_for('archives') }}" class="{{ 'active-link' if active_page == 'archives' }}">ARCHIVES</a></li>
    <li><a href="{{url_for('logout')}}" class="accent-link {{'active-link' if active_page=='login'}}">LOGOUT</a></li>
   {% else %}
    <li><a class="accent-link {{'active-link' if active_page=='login'}}" href="{{ url_for('login')}}">LOGIN</a></li>
    <li><a href="{{url_for('register')}}" class="{{'active-link' if active_page=='register'}}">REGISTER</a></li>
   {% endif %}
   </ul>
 </nav>

 <div id="overlay" onclick="closeSidebar()" aria-hidden="true"></div>

 {% block body %} {%endblock%}
</body>

</html>
