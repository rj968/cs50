{%extends "layout.html"%}

{% block title%}
    history
{% endblock %}

{% block main %}
    <table class='table table-striped table-bordered'>
        <thead>
            <th scope='col'>TIME</th>
            <th scope='col'>ORDER TYPE</th>
            <th scope='col'>SYMBOL</th>
            <th scope='col'>PRICE</th>
            <th scope='col'>QTY</th>
            <th scope='col'>TOTAL</th>
        </thead>

        {% for row in data %}
        <tr scope='row'>
            <td>{{ row.timestamp }}</td>
            <td ><b>{{ row.type }}</b></td>
            <td>{{row.symbol}}</td>
            <td>{{row.price}}</td>
            <td>{{row.qty}}</td>
            <td>{{row.total}}</td>
        </tr>
        {%endfor%}
    </table>

{% endblock %}
