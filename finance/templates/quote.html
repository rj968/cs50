{% extends "layout.html" %}

{% block title %}
    quote
{% endblock %}

{% block main %}
    <form action='/quote' method='post'>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" placeholder="enter symbol. ex-GOOG" type="text">
            <button class="btn btn-primary" type="submit">submit</button>
        </div>
    </form>
    {% block quote %}{%endblock%}
{% endblock %}
