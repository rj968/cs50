{% extends "quote.html" %}

{% block quote %}

        <thead>
            <th scope='col'>SYMBOL</th>
            <th scope='col'>NAME</th>
            <th scope='col'>PRICE</th>
        </thead>
        <tr>

            <td> {{quotes.price}} </td>
        </tr>
    </table>
{% endblock %}
